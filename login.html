<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Cartelera de Cine</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
</head>
<body>
    <div id="particles-js-left" class="particles-js"></div>
    <div id="particles-js-right" class="particles-js"></div>

    <div class="auth-wrapper">
        <div class="login-container mt-4">
            <h2 class="text-center mb-1"><i class="bi bi-film me-2"></i>Cartelera de Cine</h2>
            <p class="text-center auth-subtitle mb-4">Inicia sesión para gestionar tus películas</p>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo:</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="tucorreo@ejemplo.com" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña:</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
            <div class="text-center mt-3">
                <p class="mb-2">¿No tienes una cuenta? <a href="register.html" class="btn btn-link">Regístrate aquí</a></p>
                <a href="home.html" class="btn btn-outline-light w-100 mt-2">
                    <i class="bi bi-house-door me-1"></i> Volver a la página principal
                </a>
            </div>
        </div>
    </div>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
