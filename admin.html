<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.0.1/css/buttons.dataTables.min.css">
    <style>
        /* Estilo adicional para el contenedor principal */
        .main-container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 20px;
        }
        body.dark-mode .main-container {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }

        /* Estilo para el botón de añadir película */
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        /* Estilo para la tabla */
        .dataTables_wrapper .dataTables_filter {
            float: right;
            text-align: right;
        }

        .dataTables_wrapper .dataTables_length {
            float: left;
        }

        .dataTables_wrapper .dataTables_info {
            float: left;
        }

        .dataTables_wrapper .dataTables_paginate {
            float: right;
            text-align: right;
        }

        /* Tabla dark mode */
        body.dark-mode table.dataTable {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }
        body.dark-mode table.dataTable thead th,
        body.dark-mode table.dataTable tbody td {
            color: #e0e0e0;
            border-color: #333;
        }
        body.dark-mode table.dataTable tbody tr {
            background-color: #1e1e1e;
        }
        body.dark-mode table.dataTable tbody tr:hover {
            background-color: #2a2a2a;
        }
        body.dark-mode .dataTables_wrapper .dataTables_filter input,
        body.dark-mode .dataTables_wrapper .dataTables_length select {
            background-color: #2b2b2b;
            color: #e0e0e0;
            border-color: #444;
        }
        body.dark-mode .dataTables_wrapper .dataTables_info,
        body.dark-mode .dataTables_wrapper .dataTables_length,
        body.dark-mode .dataTables_wrapper .dataTables_filter,
        body.dark-mode .dataTables_wrapper .dataTables_paginate {
            color: #e0e0e0;
        }
        body.dark-mode .paginate_button {
            color: #e0e0e0 !important;
            background-color: #2b2b2b;
            border-color: #444;
        }
        body.dark-mode .paginate_button:hover {
            background-color: #007bff !important;
            color: #fff !important;
        }
        body.dark-mode .paginate_button.current {
            background-color: #007bff !important;
            color: #fff !important;
        }

        /* Estilo adicional para el modal */
        .modal-header {
            background-color: #007bff;
            color: white;
        }

        .modal-footer .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .modal-footer .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        /* Modal dark mode */
        body.dark-mode .modal-content {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }
        body.dark-mode .modal-header {
            background-color: #0056b3;
        }
        body.dark-mode .modal-body {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }
        body.dark-mode .modal-body .form-control {
            background-color: #2b2b2b;
            color: #e0e0e0;
            border-color: #444;
        }
        body.dark-mode .modal-body .form-label {
            color: #e0e0e0;
        }
        body.dark-mode .btn-close {
            filter: invert(1);
        }
    </style>
</head>
<body>
    <div id="particles-js-left" class="particles-js"></div>
    <div id="particles-js-right" class="particles-js"></div>   


    <!-- Barra de navegación (renderizada por navbar.js) -->
    <nav id="navbar" data-nav="admin"></nav>

    <div class="container main-container mt-5">
        <h1 class="text-center">C.R.U.D</h1>

        <!-- Botón para añadir nueva película -->
        <div class="d-flex justify-content-end mb-3">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#movieModal">Añadir Película</button>
        </div>

        <!-- Tabla de DataTables -->
        <table id="moviesTable" class="display nowrap" style="width:100%">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Género</th>
                    <th>Duración</th>
                    <th>Fecha de Estreno</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Filas de ejemplo, reemplazar con datos dinámicos -->
                <tr>
                    <td>Intensamente 2</td>
                    <td>Animacion</td>
                    <td>96 min</td>
                    <td>2024-06-14</td>
                    <td>
                        <button class="btn btn-warning btn-sm edit-btn" data-id="1">Editar</button>
                        <button class="btn btn-danger btn-sm delete-btn" data-id="1">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal para añadir/editar película -->
    <div class="modal fade" id="movieModal" tabindex="-1" aria-labelledby="movieModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="movieModalLabel">Añadir Película</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="movieForm">
                        <div class="mb-3">
                            <label for="title" class="form-label">Título</label>
                            <input type="text" class="form-control" id="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="genre" class="form-label">Género</label>
                            <input type="text" class="form-control" id="genre" required>
                        </div>
                        <div class="mb-3">
                            <label for="duration" class="form-label">Duración</label>
                            <input type="text" class="form-control" id="duration" required>
                        </div>
                        <div class="mb-3">
                            <label for="releaseDate" class="form-label">Fecha de Estreno</label>
                            <input type="date" class="form-control" id="releaseDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="horario" class="form-label">Horario</label>
                            <input type="time" class="form-control" id="horario" value="18:00">
                        </div>
                        <input type="hidden" id="movieId">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.0.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.0.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.0.1/js/buttons.print.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.3/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
    <script src="assets/js/admin.js"></script>
</body>
</html>
